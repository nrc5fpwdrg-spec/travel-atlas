<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Atlas</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f7fb;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

.page{
  display:none;
  padding:20px;
}

.page.active{
  display:block;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
}

.bottom button{
  flex:1;
  border:none;
  background:white;
  padding:15px;
  font-size:16px;
}

.bottom button:hover{
  background:#eef2ff;
}
</style>
</head>
<body>

<header>🌍 Travel Atlas</header>

<div id="map" class="page active">
<h2>Žemėlapis</h2>
<p>Pirmas testas – ar veikia mygtukai.</p>
</div>

<div id="add" class="page">
<h2>Pridėti kelionę</h2>

<input id="country" placeholder="Šalis"><br><br>

<input id="city" placeholder="Miestas"><br><br>

<input id="date" type="date"><br><br>

<button>Išsaugoti</button>

</div>

<div id="history" class="page">
<h2>Istorija</h2>
<div id="tripList"></div>

</div>

<div id="stats" class="page">
<h2>Statistika</h2>
<p>Čia vėliau bus statistika.</p>
</div>

<div class="bottom">
<button onclick="showPage('map')">🌍</button>
<button onclick="showPage('add')">➕</button>
<button onclick="showPage('history')">🗓️</button>
<button onclick="showPage('stats')">📊</button>
</div>
<script>
let trips = JSON.parse(localStorage.getItem('travelAtlasTrips')) || [];

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');

  if(id === 'history'){
    renderTrips();
  }
}

function saveTrip(){
  const country = document.getElementById('country').value;
  const city = document.getElementById('city').value;
  const date = document.getElementById('date').value;

  if(country === '' || city === '' || date === ''){
    alert('Įrašykite šalį, miestą ir datą');
    return;
  }

  trips.push({
    country: country,
    city: city,
    date: date
  });

  localStorage.setItem(
    'travelAtlasTrips',
    JSON.stringify(trips)
  );

  alert('Kelionė išsaugota');

  showPage('history');
}

function renderTrips(){
  const list = document.getElementById('tripList');

  if(!list) return;

  if(trips.length === 0){
    list.innerHTML = '<p>Kelionių dar nėra.</p>';
    return;
  }

  list.innerHTML = '';

  trips.forEach(trip=>{
    list.innerHTML += 
      <div style="
        background:white;
        padding:10px;
        margin-bottom:10px;
        border:1px solid #ddd;
        border-radius:10px;
      ">
        <b>${trip.country}</b><br>
        📍 ${trip.city}<br>
        📅 ${trip.date}
      </div>
    ;
  });
}

renderTrips();
</script>

</body>
</html>
